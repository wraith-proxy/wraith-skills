default_language_version:
  python: python3.12
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-added-large-files
        args: [--maxkb=256]
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: check-symlinks
    -   id: destroyed-symlinks
    -   id: check-executables-have-shebangs
    -   id: check-shebang-scripts-are-executable
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    -   id: codespell
        exclude: \.secrets\.baseline\.json
        args: [--ignore-words-list=disjointness]
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline.json']
-   repo: https://github.com/wraith-proxy/wraith-tooling
    rev: b1b679614c2a4601363208459461daf036200559
    hooks:
    -   id: wraith-lint-skills
    -   id: wraith-build-copilot
    -   id: wraith-privacy-scan
    -   id: wraith-file-types
    -   id: wraith-check-plugin
-   repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
    -   id: commitizen
