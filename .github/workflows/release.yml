name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # v3.3.0 reads client-id || app-id as the JWT issuer, so the App
          # ID works here unchanged; app-id is deprecated (#87).
          client-id: ${{ secrets.WRAITH_BOT_APP_ID }}
          private-key: ${{ secrets.WRAITH_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: wraith-proxy/wraith-tooling@b1b679614c2a4601363208459461daf036200559 # v0.1.2
      - name: bump, tag and release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          prev="$(git describe --tags --abbrev=0)"
          if git diff --quiet "$prev" HEAD; then
            echo "no file changes since last release"
            exit 0
          fi
          # Subjects only: commitizen also reads bodies (issue #78).
          increment="$(git log --format=%s "$prev"..HEAD \
            | wraith-release-gate)"
          if [ "$increment" = NONE ]; then
            echo "no releasing commit subjects since $prev"
            exit 0
          fi
          slug="${{ steps.app.outputs.app-slug }}"
          bot_id="$(gh api "/users/${slug}[bot]" --jq .id)"
          git config user.name "${slug}[bot]"
          git config user.email "${bot_id}+${slug}[bot]@users.noreply.github.com"
          before="$(uvx --from commitizen==4.19.3 cz version --project)"
          uvx --from commitizen==4.19.3 cz --no-raise 3,21 bump --yes --increment "$increment" \
            --changelog --changelog-to-stdout --git-output-to-stderr > notes.md
          after="$(uvx --from commitizen==4.19.3 cz version --project)"
          if [ "$before" = "$after" ]; then
            echo "no commits to bump"
            exit 0
          fi
          user_args=()
          if ! git diff --quiet "$prev" HEAD -- RELEASE_NOTES.md; then
            user_args=(--user RELEASE_NOTES.md)
          fi
          wraith-release-notes --generated notes.md \
            "${user_args[@]}" > final_notes.md
          git push origin HEAD:main "v$after"
          git push origin "v$after:refs/heads/release"
          gh release create "v$after" --title "v$after" --notes-file final_notes.md
