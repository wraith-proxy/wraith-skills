name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WRAITH_BOT_APP_ID }}
          private-key: ${{ secrets.WRAITH_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: bump, tag and release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if git diff --quiet "$(git describe --tags --abbrev=0)" HEAD; then
            echo "no file changes since last release"
            exit 0
          fi
          slug="${{ steps.app.outputs.app-slug }}"
          bot_id="$(gh api "/users/${slug}[bot]" --jq .id)"
          git config user.name "${slug}[bot]"
          git config user.email "${bot_id}+${slug}[bot]@users.noreply.github.com"
          prev="$(git describe --tags --abbrev=0)"
          before="$(uv run cz version --project)"
          uv run cz --no-raise 3,21 bump --yes --changelog \
            --changelog-to-stdout --git-output-to-stderr > notes.md
          after="$(uv run cz version --project)"
          if [ "$before" = "$after" ]; then
            echo "no commits to bump"
            exit 0
          fi
          user_args=()
          if ! git diff --quiet "$prev" HEAD -- RELEASE_NOTES.md; then
            user_args=(--user RELEASE_NOTES.md)
          fi
          uv run python scripts/release_notes.py --generated notes.md \
            "${user_args[@]}" > final_notes.md
          git push origin HEAD:main "v$after"
          git push origin "v$after:refs/heads/release"
          gh release create "v$after" --title "v$after" --notes-file final_notes.md
