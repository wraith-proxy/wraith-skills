name: upstream-sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      vet: ${{ steps.drift.outputs.vet }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # v3.3.0 reads client-id || app-id as the JWT issuer, so the App
          # ID works here unchanged; app-id is deprecated (#87).
          client-id: ${{ secrets.WRAITH_BOT_APP_ID }}
          private-key: ${{ secrets.WRAITH_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Fetch old and new upstream
        run: |
          sh scripts/fetch_upstream.sh
          sh scripts/fetch_upstream.sh --new-dir .upstream-new
      - name: Compare upstream
        id: sync
        run: |
          code=0
          keys=$(uv run python scripts/sync_upstream.py \
            --old .upstream --new .upstream-new \
            --report sync-report.md) || code=$?
          drift=false
          if grep -q '^## Companion drift' sync-report.md; then
            drift=true
          fi
          {
            echo "code=$code"
            echo "keys=$keys"
            echo "drift=$drift"
          } >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 10 ] && [ "$code" != 20 ]; then
            echo "sync_upstream.py failed with exit code $code"
            exit "$code"
          fi
      - name: Check for open sync PR
        id: open
        if: steps.sync.outputs.code != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          n=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("bot/upstream-sync-"))] | length')
          if [ "$n" != 0 ]; then
            echo "An open upstream sync PR exists; skipping PR creation."
          fi
          echo "exists=$([ "$n" != 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Open sync PR
        id: pr
        if: steps.sync.outputs.code != '0' && steps.open.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KEYS: ${{ steps.sync.outputs.keys }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          for key in $KEYS; do
            url=$(grep "^$key " scripts/fetch_upstream.sh | cut -d' ' -f2)
            ref=$(git -C ".upstream-new/$key" describe --tags --exact-match 2>/dev/null || echo -)
            sha=$(git -C ".upstream-new/$key" rev-parse HEAD)
            sed -i "s|^$key .*|$key $url $ref $sha|" scripts/fetch_upstream.sh
          done
          uv run python scripts/build_copilot.py
          branch="bot/upstream-sync-$(date -u +%Y%m%d)"
          git switch -c "$branch"
          git add -u
          type=$(git diff --name-only HEAD | uv run python scripts/sync_commit_type.py)
          git commit --allow-empty -m "👻 $type/WSK-00010: sync upstream ${KEYS:-report only}"
          git push origin "$branch"
          url=$(gh pr create --head "$branch" \
            --title "👻 $type/WSK-00010: sync upstream ${KEYS:-report only}" \
            --body-file sync-report.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.sync.outputs.code == '10' && steps.pr.outputs.url != '' && env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
      - name: Trigger evals
        id: evals
        if: steps.sync.outputs.code == '10' && steps.pr.outputs.url != ''
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set; evals skipped."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code@2.1.316
          ok=true
          claude plugin eval . --trust-plugin --ablation none \
            --tag trigger --max-cost-usd 5 || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Flag risky syncs
        if: steps.pr.outputs.url != '' && (steps.sync.outputs.code != '10' || steps.evals.outputs.ok == 'false')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh label create needs-review --color d93f0b --force
          gh pr edit "$PR_URL" --add-label needs-review
      - name: Enable auto-merge on safe syncs
        if: steps.pr.outputs.url != '' && steps.sync.outputs.code == '10' && steps.evals.outputs.ok != 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          # Native auto-merge only waits for checks that main requires, so
          # enable it only while a ruleset requires one (settings in #84).
          # Otherwise the PR waits for review instead of merging unchecked.
          required="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks")] | length' \
            || echo 0)"
          id="$(gh pr view "$PR_URL" --json id --jq .id)"
          headline="$(gh pr view "$PR_URL" --json title,number \
            --jq '"\(.title) (#\(.number))"')"
          if [ "$required" -gt 0 ] && gh api graphql -f id="$id" \
            -f headline="$headline" -f query='
            mutation($id: ID!, $headline: String!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $id, mergeMethod: SQUASH,
                commitHeadline: $headline
              }) { clientMutationId }
            }'; then
            echo "auto-merge enabled; GitHub merges once test passes"
          else
            echo "auto-merge not enabled; leaving the PR for review"
            gh label create needs-review --color d93f0b --force
            gh pr edit "$PR_URL" --add-label needs-review
          fi
      - name: Companion drift issues
        id: drift
        if: steps.sync.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # A closed re-vet issue whose drift fingerprint matches stays
          # closed: the owner has seen these exact changes (#91). New or
          # changed drift is queued for the vet and propose jobs (#95).
          gh issue list --state all --limit 500 \
            --json number,title,state,body > issues.json
          uv run python scripts/drift_issues.py --report sync-report.md \
            --issues issues.json --out . > actions.txt
          : > vet.txt
          while read -r action key number; do
            sha=$(git -C ".upstream-new/$key" rev-parse HEAD)
            case "$action" in
              keep) echo "re-vet $key: #$number already shows this drift" ;;
              edit)
                gh issue edit "$number" --body-file "body-$key.md"
                echo "$key $number $sha" >> vet.txt
                ;;
              create)
                url=$(gh issue create --title "re-vet $key" \
                  --body-file "body-$key.md")
                echo "$key ${url##*/} $sha" >> vet.txt
                ;;
              skip) echo "re-vet $key: closed in #$number, not reopened" ;;
            esac
          done < actions.txt
          vet=$(jq -cnR '[inputs | select(length > 0) | split(" ")
            | {key: .[0], issue: (.[1] | tonumber), sha: .[2]}]' < vet.txt)
          echo "vet=$vet" >> "$GITHUB_OUTPUT"

  # Machine read of a re-vet (#95). No write token reaches this job, and
  # the model runs with no tools: it sees the diff as text and answers with
  # JSON that scripts/vet_companion.py checks before anything uses it.
  vet:
    needs: sync
    if: needs.sync.outputs.vet != '' && needs.sync.outputs.vet != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.sync.outputs.vet) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Bundle the named-skill diff
        env:
          KEY: ${{ matrix.target.key }}
          SHA: ${{ matrix.target.sha }}
        run: |
          vet="uv run python scripts/vet_companion.py"
          $vet fetch --key "$KEY" --dest vet/old
          $vet fetch --key "$KEY" --sha "$SHA" --dest vet/new
          $vet bundle --key "$KEY" --old vet/old --new vet/new --out vet/bundle
          $vet prompt --bundle vet/bundle > vet/prompt.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Machine read
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set; the re-vet stays unread"
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code@2.1.316
          cd vet
          claude -p --bare --tools "" --no-session-persistence \
            --output-format json --model claude-sonnet-5-5 \
            --max-budget-usd 1 < prompt.txt > raw.json \
            || echo "machine read failed; the re-vet stays unread"
      - name: Check the verdict
        run: |
          uv run python scripts/vet_companion.py verdict \
            --bundle vet/bundle --raw vet/raw.json
          cat vet/bundle/verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vet-${{ matrix.target.key }}
          path: vet/bundle

  # Turns the verdict into a pin bump and an ADR addendum, then opens or
  # refreshes the re-vet PR. Never merged here: the owner's merge is the
  # acceptance (#95).
  propose:
    needs: [sync, vet]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.sync.outputs.vet) }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # v3.3.0 reads client-id || app-id as the JWT issuer, so the App
          # ID works here unchanged; app-id is deprecated (#87).
          client-id: ${{ secrets.WRAITH_BOT_APP_ID }}
          private-key: ${{ secrets.WRAITH_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vet-${{ matrix.target.key }}
          path: vet/bundle
      - name: Open or refresh the re-vet PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          KEY: ${{ matrix.target.key }}
          ISSUE: ${{ matrix.target.issue }}
        run: |
          branch="bot/re-vet-$KEY"
          git switch -C "$branch"
          title=$(uv run python scripts/vet_companion.py apply \
            --bundle vet/bundle --ticket "$ISSUE" --root . \
            --pr-body pr-body.md)
          if [ -z "$title" ]; then
            echo "no named-skill drift against the pin; nothing to propose"
            exit 0
          fi
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add scripts/fetch_upstream.sh docs/adr
          git commit -q -m "$title"
          git push --force origin "$branch"
          gh label create needs-review --color d93f0b --force
          number=$(gh pr list --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file pr-body.md \
              --add-label needs-review
          else
            gh pr create --head "$branch" --title "$title" \
              --body-file pr-body.md --label needs-review
          fi
