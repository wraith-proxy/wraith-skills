name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The PR title becomes the squash subject, and that alone decides a
      # release (#89). The title arrives through env, never as code.
      - name: PR title is a valid squash subject
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uvx --from commitizen==4.19.3 cz check --message "$TITLE"
      - uses: wraith-proxy/wraith-tooling@93b9b879d4ec2e5621d8a17a01a5b6a688e85eea # v0.1.1
      - run: uvx --python 3.12 pre-commit run --all-files --show-diff-on-failure
      - run: wraith-privacy-scan
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - run: claude plugin validate --strict .
