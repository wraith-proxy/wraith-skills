name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run python scripts/privacy_scan.py
      - if: hashFiles('hooks/guard.py') != ''
        run: uv run --python 3.9 --no-project python -m py_compile hooks/session_start.py hooks/guard.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - run: claude plugin validate --strict .

  # ponytail: private repo on GitHub Free has no native auto-merge or
  # required checks; this job is the gate. Merges made with GITHUB_TOKEN
  # do not trigger push runs on main, so it dispatches release.yml itself.
  automerge:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[automerge]')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - run: |
          subject="$(printf '%s' "$TITLE" | sed 's/ *\[automerge\] */ /g; s/^ *//; s/ *$//') (#$PR)"
          gh pr merge "$PR" --squash --match-head-commit "$SHA" \
            --subject "$subject" --repo "$GITHUB_REPOSITORY"
          gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
