name: evals

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Eval tag to run
        type: choice
        options: [trigger, quality, all]
        default: trigger

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: Run evals
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "evals skipped: no ANTHROPIC_API_KEY secret"
            exit 0
          fi
          args=""
          if [ "$TAG" != "all" ]; then args="--tag $TAG"; fi
          claude plugin eval . --trust-plugin --json results.json --ablation none --threshold 0.8 --model claude-sonnet-5-5 --judge-model claude-haiku-5-5 --no-publish --max-cost-usd 10 $args
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('results.json') != ''
        with:
          name: results
          path: results.json
