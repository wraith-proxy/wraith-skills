---
commitizen:
  bump_message: ':ghost: chore: release v$current_version -> v$new_version [skip ci]'
  customize:
    bump_map:
      break: MAJOR
      bug: PATCH
      feature: MINOR
      fix: PATCH
    bump_pattern: "^\U0001F47B (feature|fix|bug|break)/WSK-\\d{5}: "
    change_type_map:
      break: Breaking Changes
      bug: Bug Fixes
      feature: Features
      fix: Bug Fixes
    change_type_order:
    - break
    - feature
    - fix
    - bug
    changelog_pattern: "^\U0001F47B (feature|fix|bug|break)/WSK-\\d{5}: "
    commit_parser: "^\U0001F47B (?P<change_type>feature|fix|bug|break)/WSK-\\d{5}:\
      \ (?P<message>.*)"
    example: "\U0001F47B feature/WSK-00001: add implementation plan"
    message_template: '{{change_type}}: {{message}}'
    questions:
    - choices:
      - name: 'break:   A breaking change'
        value: break
      - name: 'feature: A new feature'
        value: feature
      - name: 'fix:     A standard fix'
        value: fix
      - name: 'bug:     A specific bug fix'
        value: bug
      - name: 'docs:     Documentation only (no release)'
        value: docs
      - name: 'chore:    Maintenance (no release)'
        value: chore
      - name: 'ci:       CI and tooling (no release)'
        value: ci
      - name: 'test:     Tests only (no release)'
        value: test
      - name: 'refactor: Refactor, no behaviour change (no release)'
        value: refactor
      message: Select the type of change you are committing
      name: change_type
      type: list
    - message: 'Enter a brief description:'
      name: message
      type: input
    schema: '<type>/<ticket>: <body>'
    schema_pattern: "^\U0001F47B (feature|fix|bug|break|docs|chore|ci|test|refactor)/WSK-\\\
      d{5}: (.+)"
  major_version_zero: true
  name: cz_customize
  tag_format: v$version
  update_changelog_on_bump: true
  version: 0.6.1
  version_files:
  - .claude-plugin/plugin.json:"version"
  - plugin.json:"version"
  version_provider: commitizen
  version_scheme: semver
